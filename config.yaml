system_prompt: 'You are a researcher tracking the real state of AI technology across
  developer communities.


  Primary sources (prioritize in this order):

  1. GitHub — trending repositories, Issues, Discussions, READMEs

  2. GitHub org/community discussions and maintainer conversations

  3. Repository documentation or example repos only when directly tied to real usage


  Always exclude:

  - Official press releases and marketing copy

  - Paywalled content

  - Benchmark-only comparisons with no real user context

  - Non-GitHub social/news sources


  Always include:

  - Specific examples, quotes, or code snippets when available

  - Honest frustrations alongside praise

  - The "why" behind people''s opinions and decisions

  - Links or references to original sources


  Format each answer with clear subsections and cite sources.

  '
summary:
  system: '당신은 AI 기술 트렌드 분석가입니다.

    수집된 커뮤니티 데이터를 읽고 한국어로 핵심만 간결하게 요약합니다.


    요약 원칙:

    - 최신 모델명/버전/출시일은 official source가 있는 항목만 사실로 단정

    - 실제 사용자 경험, 커뮤니티 반응, 기술적 인사이트 중심

    - 긍정/부정 반응 균형 있게 정리

    - 구체적 이유·사례·수치가 있으면 반드시 포함

    - 중복 내용 통합, 각 섹션 3~5개 bullet point로 압축

    - 특히 실행 가능한(actionable) 인사이트 강조

    - 직접 커뮤니티 소스가 부족하면 "직접 커뮤니티 반응 부족"을 명시

    - 벤치마크/서드파티 요약만 있는 항목을 "신규 공식 출시"처럼 쓰지 말 것

    - LOW confidence 항목은 배경 정보로만 취급하고, headline/키워드/액션 아이템에 올리지 말 것


    중복 제거 원칙:

    - 프롬프트에 [전날 요약]이 제공된 경우, 이미 다룬 모델·레포·방법론은 오늘 유의미한 업데이트 없으면 생략

    - 오늘 처음 등장하는 항목은 [신규], 전날 대비 수치·상태·반응이 크게 바뀐 항목은 [업데이트] 태그 사용

    - 반복 항목이 많을수록 ⚡ 오늘의 핵심 섹션을 더 짧게 유지 (3개 이하도 무방)

    '
  input_limits:
    previous_summary_chars: 900
    max_direct_results: 6
    max_answer_chars_high: 900
    max_answer_chars_medium: 500
    max_citations_per_result: 2
    github_trending: 5
    hackernews: 5
    practice_groups: 3
    practice_items_per_group: 1
    include_low_confidence: false
  confidence_gate:
    medium_min_community_sources: 1
    high_min_community_sources: 3
    low_confidence_max_chars: 900
    suppress_low_confidence_headlines: true
    low_confidence_prompt_mode: note_only
    include_low_confidence_sources: false
    low_confidence_notice: LOW confidence 항목은 승인된 공식/직접 커뮤니티 근거가 부족하므로 배경 정보로만 사용
    source_rules:
      official-direct: official_only
      direct-community: community_only
      direct-practice: community_only
  output_format: '출력 형식 (전체 분량 목표: 총 20~25줄 이내):

    # AI Tech Digest 요약 — {date}


    ## ⚡ 오늘의 핵심 (전날 대비 NEW & 주목)

    (2~3개 bullet. [신규] 또는 [업데이트] 태그 필수. 임팩트 큰 것 우선)


    ## 🔑 핵심 키워드 & 방향성

    (키워드 4~6개 볼드 나열 후, 방향성 1줄)


    ## 🏢 기업 신기능 & 공식 발표

    (전날과 다른 내용만, 2bullet 이하. 없으면 생략)


    ## 🤖 신규 모델 & 커뮤니티 반응

    (전날과 다른 내용만, 2bullet 이하. 없으면 생략)


    ## ⚙️ AI 기법 & 아키텍처

    (전날과 다른 내용만, 2bullet 이하. 없으면 생략)


    ## 🧬 바이브코딩 & 방법론 진화

    (전날과 다른 내용만, 2bullet 이하. 없으면 생략)


    ## 🔥 커뮤니티 인기 콘텐츠

    (GitHub Trending 전날과 다른 레포만, 3개 이하 표 형식)


    ## 🛠️ AI 툴 & 워크플로우

    (전날과 다른 내용만, 2bullet 이하. 없으면 생략)


    ## 💡 오늘의 액션 아이템

    (당장 써먹을 수 있는 것 1~2가지. 한 줄씩 구체적으로.)

    '
sections:
- id: company_announcements
  title: 기업 신기능 & 공식 발표
  emoji: 🏢
  queries:
  - id: company_features_plugins
    title: 신기능·플러그인·제품 발표 (모델 외)
    source_policy: official+github
    use_official_context: true
    query: 'What did major AI companies ({companies}) announce in the past 48 hours
      that is NOT just a new model? Include: new plugins (e.g. financial tools, code
      execution, integrations), API features (e.g. prompt caching, extended context),
      SDK updates, product changes, pricing changes, policy updates, MCP (Model Context
      Protocol) server releases. Capture immediate developer reactions from GitHub
      repositories, GitHub Issues, and GitHub Discussions. What surprised people?
      What are developers excited or disappointed about?

      '
  - id: model_release_official_watch
    title: 공식 모델 릴리즈 체크 — 최신 버전/날짜 확인
    recency: week
    source_policy: official+github
    query: 'Verify the latest official AI model or major model update releases from
      {companies} in the past 7 days using official sources first (official blogs,
      release notes, API docs, model cards, help docs). For each release, give the
      exact model/version name, exact release date, official source URL, and whether
      it is a genuinely new release or just later benchmark chatter about an older
      release. If there is confusion between nearby versions (for example GPT-5.3
      vs GPT-5.4), resolve the conflict explicitly and state which version is the
      latest official one.

      '
  - id: model_new_release
    title: 신규 모델 릴리즈 — 커뮤니티 즉각 반응
    recency: week
    source_policy: official+github
    use_official_context: true
    query: 'For the latest model releases from the past 7 days, gather immediate community
      reactions from GitHub Discussions, GitHub Issues, and repositories integrating
      or comparing those models. First confirm which release is actually the newest,
      then capture first impressions, benchmark results people actually tested, and
      honest disappointments. Distinguish clearly between: 1) the official latest
      release, 2) community reaction to that release, 3) benchmark chatter about older
      versions. Real user reactions only, not press releases.

      '
  - id: model_real_perf
    title: 모델별 실사용 성능 — 개발자 직접 비교
    query: 'What are developers saying this week about real-world differences between
      AI models ({models})? Focus on practical task comparisons from GitHub Discussions,
      GitHub Issues, and repositories where developers say "I tried X and it did better/worse
      at Y than Z." Include coding tasks, reasoning, long context, cost-per-result
      comparisons. No benchmark scores — only actual user experiences.

      '
- id: ai_techniques
  title: AI 기법 & 아키텍처
  emoji: ⚙️
  queries:
  - id: technique_md_patterns
    title: CLAUDE.md / AGENTS.md / 시스템 프롬프트 활용 패턴
    use_practice_context: true
    query: 'What are developers sharing about effective CLAUDE.md, AGENTS.md, or system
      prompt design patterns recently? Real tips from GitHub repositories, GitHub
      Issues, and GitHub Discussions. Include: file structure patterns, what to put
      in vs. leave out, how to manage context size, project-level vs. global instructions,
      memory systems, and what people discovered doesn''t work.

      '
  - id: technique_agent_architecture
    title: Agent 아키텍처 & 오케스트레이션 패턴
    use_practice_context: true
    query: 'What new agent architecture patterns are developers actually using recently?
      Look for real implementations and discussions on GitHub repositories, GitHub
      Issues, and GitHub Discussions about: multi-agent orchestration (harness patterns,
      hub-and-spoke, swarm), MCP (Model Context Protocol) server usage, tool-use design,
      spec-driven agent development, how people structure agent loops and handoffs.
      Include GitHub repos with significant stars that demonstrate these patterns.
      What actually works vs. what looks good on paper but fails in practice?

      '
  - id: technique_optimization
    title: 프롬프트 최적화 & 토큰/비용 절감 기법
    use_practice_context: true
    query: 'What practical prompt engineering and cost optimization techniques are
      developers sharing recently? Real tips from GitHub repositories, GitHub Issues,
      and GitHub Discussions about: prompt caching strategies, context compression
      (LLMLingua, etc.), model routing (cheap vs. expensive models), batch processing
      tricks, structured output optimization, RAG vs. long context trade-offs. What
      actually reduced costs significantly? Include numbers when available.

      '
  - id: technique_new_patterns
    title: 새로운 개발 방법론 & 워크플로우 패턴
    use_practice_context: true
    query: 'What new software development methodologies or workflow patterns specific
      to AI-assisted coding are gaining traction recently? Real discussions from GitHub
      repositories, GitHub Issues, and GitHub Discussions about: spec-driven development
      with AI, TDD with AI agents, AI-assisted code review, pair programming with
      tools like {tools}, how developers structure repos for AI readability (file
      naming, comments, README conventions). What changed in actual team workflows?

      '
- id: vibedev_evolution
  title: 바이브코딩 & 방법론 진화
  emoji: 🧬
  queries:
  - id: vibedev_shifting_consensus
    title: 방법론 패러다임 전환 — "정설"이 바뀌고 있는 것들
    use_practice_context: true
    query: 'What developer best practices or "accepted wisdom" around AI-assisted
      coding are being challenged or reversed recently? Look for debates on GitHub
      repositories, Issues, and GitHub Discussions where people are saying "we used
      to think X was the right way, but now..." Examples of the kind of shift to find:
      - CLAUDE.md / AGENTS.md: was "write everything in detail" now becoming "less
      is more"? - Context files: are people moving away from large constraint files?
      - Spec-first vs. vibe-first: is one approach winning? - Rules and restrictions:
      are heavily constrained agents losing to free-range agents? Find real community
      debates where the consensus is actively shifting. Who are the main voices on
      each side and what''s their evidence?

      '
  - id: vibedev_expert_vs_beginner
    title: 고수 vs 초보 — 전문가들이 실제로 쓰는 구조
    use_practice_context: true
    query: 'How do experienced, professional developers use AI coding tools differently
      from beginners recently? Real examples and discussions from GitHub repositories,
      GitHub Issues, and GitHub Discussions about: - Specific repo structures or file
      layouts experts use that beginners don''t - How experts set up context, memory,
      or constraint files (or deliberately don''t) - Harness patterns, modular agent
      design, tool orchestration in real projects - How experts handle code review,
      testing, and safety nets around AI output - What "vibe coding" means to a senior
      engineer vs. a non-coder Include links to actual repos, blog posts, or threads
      that show real expert setups.

      '
  - id: vibedev_new_structures
    title: 신규 등장 구조 & 컨벤션 — 이번 주 처음 보이는 패턴
    use_practice_context: true
    query: 'What brand-new structural patterns, repo conventions, or workflow approaches
      for AI-assisted development appeared or gained significant traction this week?
      Focus on things that didn''t exist or weren''t discussed 3-6 months ago. Look
      on GitHub (new repos with sudden stars), GitHub Discussions, and maintainer/user
      conversations in repositories for: - New file/folder naming conventions designed
      for AI readability - New agent loop structures or harness architectures - New
      ways to split human vs. AI responsibilities in a codebase - New prompt chaining
      or context management approaches - Tools or frameworks that enable entirely
      new workflows What problem does each new pattern solve that old approaches couldn''t?

      '
  - id: vibedev_real_project_outcomes
    title: 실제 프로젝트 결과 — 성공/실패 사례 & 한계
    use_practice_context: true
    query: 'What are developers sharing about real project outcomes from AI-assisted
      or "vibe coding" development recently? Look for honest post-mortems, case studies,
      and candid discussions on GitHub repositories, Issues, and GitHub Discussions
      about: - Projects successfully built end-to-end with AI agents (what worked?)
      - Where AI-driven development broke down (large codebases, security, performance?)
      - Surprising failures: things that looked finished but weren''t - How teams
      recovered from AI-generated technical debt - What developers wish they had done
      differently - The "wall" people hit and how (or if) they got past it Real stories
      with specific technical details preferred over general opinions.

      '
- id: community_trending
  title: 커뮤니티 인기 콘텐츠
  emoji: 🔥
  queries:
  - id: community_youtube
    title: GitHub Discussions 인기 기술 토론
    query: 'What GitHub Discussions or GitHub issue threads got high engagement in
      the past week around AI or software development? Focus on highly commented discussions,
      maintainer replies, and practical takeaways. What topics did they cover and
      why did developers care?

      '
  - id: community_github
    title: GitHub Trending & 주목받는 오픈소스 프로젝트
    use_practice_context: true
    query: 'What GitHub repositories gained significant stars or community attention
      in the past week? Focus on: AI/LLM tools and frameworks, developer productivity
      tools, new agent frameworks, and repos with strong GitHub Discussion or Issue
      activity. What problem does each solve? What''s the community saying about it?
      Include star counts and key features.

      '
  - id: community_influencers
    title: 메인테이너 & 개발자 인기 GitHub 포스트
    query: 'What GitHub posts, discussions, or issue threads from well-known AI developers,
      maintainers, or tool authors got significant engagement in the past week? Focus
      on maintainers of tools like {tools}, major AI repos, and popular GitHub Discussions.
      What were the key arguments, insights, or implementation tips?

      '
- id: ai_tools
  title: AI 툴 & 워크플로우
  emoji: 🛠️
  queries:
  - id: tools_landscape
    title: AI 코딩 툴 전체 비교 — 실사용 평가
    query: 'What are developers actually recommending recently for AI-assisted coding?
      Compare tools like {tools} based on real GitHub Issues, GitHub Discussions,
      and repository usage reports. What are the hidden strengths and weaknesses people
      only discover after extended use? What made people switch tools recently?

      '
  - id: tools_workflow_change
    title: AI로 인한 실제 개발 워크플로우 변화
    use_practice_context: true
    query: 'How has AI actually changed day-to-day software development workflows
      recently? Real experiences from developers on GitHub Issues, GitHub Discussions,
      and repositories about: what tasks they delegated to AI, what they kept manual,
      how code review changed, how debugging changed, what surprised them about working
      with AI agents long-term. Include both individual developers and team-level
      changes.

      '
  - id: tools_new_rising
    title: 새롭게 주목받는 AI 개발 툴 & 프레임워크
    use_practice_context: true
    query: 'What new AI development tools, frameworks, or integrations gained community
