claude:
  model: claude-sonnet-4-6
  max_tokens: 1800
github:
  lookback_days: 7
  min_stars: 50
  limit: 15
  top_n: 5
query_defaults:
  source_policy: github-only
  use_official_context: false
  use_practice_context: false
  raw_markdown_chars: 550
source_filters:
  official_group: official_vendor
  domain_groups:
    github_community:
    - github.com
    - www.github.com
    official_vendor:
    - openai.com
    - www.openai.com
    - help.openai.com
    - platform.openai.com
    - anthropic.com
    - www.anthropic.com
    - docs.anthropic.com
    - ai.google.dev
    - deepmind.google
    - blog.google
    - developers.googleblog.com
    - meta.com
    - ai.meta.com
    - mistral.ai
    - docs.mistral.ai
    - x.ai
    - www.x.ai
    - cohere.com
    - docs.cohere.com
  policies:
    github-only:
    - github_community
    official+github:
    - official_vendor
    - github_community
rendering:
  raw_markdown:
    max_answer_lines: 8
    max_sources: 2
    separate_low_confidence_items: true
    low_confidence_section_title: '참고: 근거가 약한 항목'
    truncation_notice: '[truncated in raw md; see raw JSON for full response]'
official_sources:
  lookback_days: 14
  include_latest_if_no_recent: true
  latest_per_vendor: 1
  date_search_chars: 6000
  model_search_chars: 8000
  vendors:
  - company: OpenAI
    note: Official OpenAI release post
    list_urls:
    - https://openai.com/index/
    link_patterns:
    - /index/introducing-gpt-
    - /index/introducing-o
    - /index/introducing-codex
    model_patterns:
    - \bGPT-\d+(?:\.\d+)?(?:\.\d+)?\b
    - \bo\d+(?:-[a-z0-9]+)?\b
    - \bCodex\b
    release_signal_patterns:
    - \bintroducing\b
    - \bannouncing\b
    - \breleased\b
    - \bavailable\b
    max_candidate_links: 30
    api_listing:
      url: https://api.openai.com/v1/models
      auth_env: OPENAI_API_KEY
      model_regex: ^(gpt-\d|o\d|codex)
      source_url: https://api.openai.com/v1/models
      note: Official OpenAI models API listing
      normalize:
        strip_date_suffix: true
        strip_latest_suffix: true
        dedupe_aliases: true
  - company: Anthropic
    note: Official Anthropic news post
    list_urls:
    - https://www.anthropic.com/news
    link_patterns:
    - /news/claude
    - /news/introducing
    exclude_link_patterns:
    - /news/claude-code-security
    model_patterns:
    - \bClaude\s+(?:Sonnet|Opus)\s+\d+(?:\.\d+)?\b
    release_signal_patterns:
    - \bintroducing\b
    - \bannouncing\b
    - \bavailable\b
    - \bnow available\b
    max_candidate_links: 25
