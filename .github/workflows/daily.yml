name: Daily Tech Digest

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST (00:00 UTC)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 결과 파일 커밋 권한
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests anthropic pyyaml

      # ── 무료 API 수집 (항상 실행) ──────────────────────

      - name: Step 0.5 - 공식 릴리즈 수집
        run: python scripts/fetch_official_sources.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Step 0.6 - GitHub Trending 수집
        run: python scripts/fetch_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 0.75 - 직접 방법론 신호 수집
        run: python scripts/fetch_practice_signals.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 0.8 - Hacker News AI 트렌드 수집
        run: python scripts/fetch_hackernews.py

      - name: Step 0 - 신규 개념 탐색 (GitHub Trending 기반)
        run: python scripts/discover_concepts.py

      - name: Step 1.5 - 직접 커뮤니티 반응 수집
        run: python scripts/fetch_community_sources.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Perplexity 수집 (선택, 실패해도 계속) ──────────

      - name: Step 1 - Perplexity 수집 (optional)
        run: python scripts/fetch_perplexity.py
        continue-on-error: true
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      # ── 요약 & 분석 ───────────────────────────────────

      - name: Step 2 - Claude 재요약
        run: python scripts/summarize_claude.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Step 3 - 패러다임 변화 감지
        run: python scripts/detect_paradigm_shifts.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "digest-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml raw/ digest/
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d) [auto]"
          git push
